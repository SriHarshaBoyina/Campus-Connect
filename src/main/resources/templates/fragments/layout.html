<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle + ' | CampusConnect'}">CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/events}"><span class="brand-dot">CC</span> CampusConnect</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto gap-lg-2">
                <li class="nav-item"><a class="nav-link" th:href="@{/events}">Explore events</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/student/dashboard}">Student dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}">Admin dashboard</a></li>
            </ul>
            <form method="post" th:action="@{/logout}" class="d-flex">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-light" type="submit">Sign out</button>
            </form>
        </div>
    </div>
</nav>
<div th:fragment="alerts" class="container pt-3">
    <div class="alert alert-success alert-dismissible fade show" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${error}" th:text="${error}"></div>
</div>
<footer th:fragment="footer" class="app-footer mt-5">
    <div class="container d-flex justify-content-between">
        <span>CampusConnect</span><span>Make campus life count.</span>
    </div>
</footer>
</body>
</html>
