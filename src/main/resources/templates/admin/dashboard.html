<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin dashboard')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav><div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container py-5"><div class="d-flex justify-content-between align-items-end mb-4"><div><p class="eyebrow">Administration</p><h1 class="page-title">Campus overview</h1></div><a class="btn btn-primary" th:href="@{/admin/events/new}">+ Create event</a></div>
    <div class="row g-3 mb-5"><div class="col-6 col-xl-3"><div class="stat-card"><span>Students</span><strong th:text="${totalStudents}">0</strong></div></div>
        <div class="col-6 col-xl-3"><div class="stat-card"><span>Total events</span><strong th:text="${totalEvents}">0</strong></div></div>
        <div class="col-6 col-xl-3"><div class="stat-card"><span>Upcoming</span><strong th:text="${#lists.size(upcomingEvents)}">0</strong></div></div>
        <div class="col-6 col-xl-3"><div class="stat-card"><span>Registrations</span><strong th:text="${totalRegistrations}">0</strong></div></div></div>
    <div class="card border-0 shadow-sm"><div class="card-body d-flex justify-content-between align-items-center"><div><h2 class="h5">Event management</h2><p class="text-secondary mb-0">Create, update and remove campus events.</p></div><a class="btn btn-outline-primary" th:href="@{/admin/events}">Manage events</a></div></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body>
</html>
