<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage events')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav><div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="eyebrow">Administration</p><h1 class="page-title">Manage events</h1></div><a class="btn btn-primary" th:href="@{/admin/events/new}">+ Create event</a></div>
    <div class="table-responsive card border-0 shadow-sm"><table class="table align-middle mb-0"><thead><tr><th>Event</th><th>Category</th><th>Date</th><th>Capacity</th><th></th></tr></thead>
        <tbody><tr th:each="event : ${events}"><td><strong th:text="${event.title}">Event</strong><br><small class="text-secondary" th:text="${event.venue}">Venue</small></td>
            <td><span class="badge text-bg-light" th:text="${event.category}">Workshop</span></td><td th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy')}">Date</td><td th:text="${event.capacity}">50</td>
            <td class="text-end"><a class="btn btn-sm btn-outline-secondary me-1" th:href="@{/admin/events/{id}/registrations(id=${event.id})}">Students</a><a class="btn btn-sm btn-outline-primary me-1" th:href="@{/admin/events/{id}/edit(id=${event.id})}">Edit</a>
                <form class="d-inline" method="post" th:action="@{/admin/events/{id}/delete(id=${event.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-sm btn-outline-danger" type="submit" data-confirm="Delete this event?">Delete</button></form></td></tr>
        <tr th:if="${#lists.isEmpty(events)}"><td colspan="5" class="text-center text-secondary py-4">No events created yet.</td></tr></tbody>
    </table></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:src="@{/js/app.js}"></script></body>
</html>
