<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registered students')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-5"><a th:href="@{/admin/events}">← Back to event management</a>
    <div class="d-flex justify-content-between align-items-end mt-3 mb-4"><div><p class="eyebrow">Registration monitoring</p>
        <h1 class="page-title" th:text="${event.title}">Event</h1></div><span class="badge text-bg-primary" th:text="${#lists.size(registrations) + ' students'}">0 students</span></div>
    <div class="table-responsive card border-0 shadow-sm"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Email</th><th>Registered at</th></tr></thead>
        <tbody><tr th:each="registration : ${registrations}"><td th:text="${registration.user.name}">Student</td><td th:text="${registration.user.email}">email</td>
            <td th:text="${#temporals.format(registration.registeredAt, 'dd MMM yyyy HH:mm')}">Date</td></tr>
        <tr th:if="${#lists.isEmpty(registrations)}"><td colspan="3" class="text-center text-secondary py-4">No active registrations.</td></tr></tbody>
    </table></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body>
</html>
