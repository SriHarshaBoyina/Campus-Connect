<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card">
        <div class="brand-mark">CC</div>
        <p class="eyebrow">CampusConnect</p>
        <h1>Welcome back</h1>
        <p class="text-secondary">Sign in to discover what is happening on campus.</p>
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
        <div class="alert alert-success" th:if="${param.logout}">You have been logged out securely.</div>
        <form method="post" th:action="@{/login}" class="mt-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label" for="username">Email address</label>
                <input class="form-control form-control-lg" id="username" name="username" type="email" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input class="form-control form-control-lg" id="password" name="password" type="password" required>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
        </form>
        <p class="text-center mt-4 mb-0">New to CampusConnect?
            <a th:href="@{/register}">Create a student account</a>
        </p>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
