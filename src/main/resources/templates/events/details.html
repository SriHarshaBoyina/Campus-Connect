<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Event details')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav><div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container py-5"><a class="text-decoration-none" th:href="@{/events}">← Back to events</a>
    <article class="detail-card mt-4">
        <div class="d-flex justify-content-between gap-3 flex-wrap"><span class="badge rounded-pill text-bg-primary" th:text="${event.category}">Workshop</span>
            <span class="text-secondary" th:text="${#temporals.format(event.eventDate, 'EEEE, dd MMMM yyyy')}">Date</span></div>
        <h1 class="display-5 fw-bold mt-4" th:text="${event.title}">Event title</h1>
        <p class="lead text-secondary" th:text="${event.description}">Description</p>
        <div class="row g-3 my-4">
            <div class="col-sm-4 detail-item"><strong>When</strong><span th:text="${#temporals.format(event.startTime, 'HH:mm') + ' - ' + #temporals.format(event.endTime, 'HH:mm')}">10:00 - 12:00</span></div>
            <div class="col-sm-4 detail-item"><strong>Where</strong><span th:text="${event.venue}">Venue</span></div>
            <div class="col-sm-4 detail-item"><strong>Capacity</strong><span th:text="${event.capacity + ' seats'}">50 seats</span></div>
        </div>
        <form method="post" th:action="@{/student/registrations/{id}(id=${event.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-primary btn-lg" type="submit">Register for this event</button>
        </form>
    </article>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body>
</html>
