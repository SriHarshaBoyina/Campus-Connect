<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Explore events')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
        <div><p class="eyebrow">Campus calendar</p><h1 class="page-title">Find your next experience</h1>
            <p class="text-secondary mb-0">Discover workshops, sports, culture and more.</p></div>
        <form class="event-filter d-flex gap-2" method="get" th:action="@{/events}">
            <input class="form-control" name="title" placeholder="Search events" th:value="${title}">
            <select class="form-select" name="category">
                <option value="">All categories</option><option>Technical</option><option>Cultural</option>
                <option>Sports</option><option>Workshop</option><option>Seminar</option><option>Hackathon</option>
            </select>
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
    </div>
    <div class="row g-4" th:if="${!#lists.isEmpty(events)}">
        <div class="col-md-6 col-xl-4" th:each="event : ${events}">
            <article class="event-card h-100">
                <div class="event-date"><strong th:text="${#temporals.format(event.eventDate, 'dd')}">15</strong>
                    <span th:text="${#temporals.format(event.eventDate, 'MMM')}">JAN</span></div>
                <span class="badge rounded-pill text-bg-light" th:text="${event.category}">Workshop</span>
                <h2 class="h4 mt-3" th:text="${event.title}">Event title</h2>
                <p class="text-secondary line-clamp" th:text="${event.description}">Description</p>
                <div class="small text-secondary mb-3"><span th:text="${event.venue}">Venue</span> ·
                    <span th:text="${#temporals.format(event.startTime, 'HH:mm')}">10:00</span></div>
                <a class="btn btn-outline-primary stretched-link" th:href="@{/events/{id}(id=${event.id})}">View details</a>
            </article>
        </div>
    </div>
    <div class="empty-state" th:if="${#lists.isEmpty(events)}"><h2>No events found</h2><p>Try a different search.</p></div>
    <nav th:if="${paged and eventPage.totalPages > 1}" class="mt-5">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${eventPage.first ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/events(page=${eventPage.number - 1},size=${eventPage.size},title=${title},category=${category})}">Previous</a></li>
            <li class="page-item active"><span class="page-link" th:text="${eventPage.number + 1}">1</span></li>
            <li class="page-item" th:classappend="${eventPage.last ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/events(page=${eventPage.number + 1},size=${eventPage.size},title=${title},category=${category})}">Next</a></li>
        </ul>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
