<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My registrations')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav><div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container py-5"><p class="eyebrow">Student portal</p><h1 class="page-title mb-4">My registrations</h1>
    <div class="row g-4"><div class="col-md-6 col-xl-4" th:each="registration : ${registrations}">
        <article class="event-card h-100"><span class="badge rounded-pill" th:classappend="${registration.status.name() == 'REGISTERED' ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${registration.status}">REGISTERED</span>
            <h2 class="h5 mt-3" th:text="${registration.event.title}">Event</h2><p class="text-secondary" th:text="${registration.event.description}">Description</p>
            <p class="small text-secondary" th:text="${#temporals.format(registration.event.eventDate, 'dd MMM yyyy')}">Date</p>
            <form method="post" th:if="${registration.status.name() == 'REGISTERED'}" th:action="@{/student/registrations/{id}/cancel(id=${registration.event.id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-danger" type="submit" data-confirm="Cancel this registration?">Cancel registration</button>
            </form>
        </article>
    </div></div>
    <div class="empty-state" th:if="${#lists.isEmpty(registrations)}"><h2>No registrations yet</h2><a class="btn btn-primary" th:href="@{/events}">Explore events</a></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:src="@{/js/app.js}"></script></body>
</html>
