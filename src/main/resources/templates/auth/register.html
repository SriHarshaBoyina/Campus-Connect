<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card">
        <div class="brand-mark">CC</div>
        <p class="eyebrow">Student registration</p>
        <h1>Join your campus</h1>
        <p class="text-secondary">Create your account to register for events and activities.</p>
        <form method="post" th:action="@{/register}" th:object="${registerForm}" class="mt-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3"><label class="form-label">Full name</label>
                <input class="form-control" th:field="*{name}" required>
                <small class="text-danger" th:errors="*{name}"></small></div>
            <div class="mb-3"><label class="form-label">University email</label>
                <input class="form-control" type="email" th:field="*{email}" required>
                <small class="text-danger" th:errors="*{email}"></small></div>
            <div class="mb-4"><label class="form-label">Password</label>
                <input class="form-control" type="password" th:field="*{password}" minlength="8" required>
                <small class="text-danger" th:errors="*{password}"></small></div>
            <button class="btn btn-primary w-100" type="submit">Create student account</button>
        </form>
        <p class="text-center mt-4 mb-0">Already registered? <a th:href="@{/login}">Sign in</a></p>
    </section>
</main>
</body>
</html>
